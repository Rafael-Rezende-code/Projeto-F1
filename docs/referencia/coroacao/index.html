<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Protótipo: A Coroação</title>
<style>
  :root{ --papel:#e4dfdc; --tinta:#0d0d0d; --ease:cubic-bezier(.22,1,.36,1); }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--papel);color:var(--tinta)}
  .escuro{background:#0b0b0c;color:#fff;min-height:60vh;display:grid;place-items:center;font:600 22px Inter,system-ui,sans-serif}

  /* Seção "fixa" : a rolagem comanda a coroação */
  .cena{position:relative;height:320svh;background:var(--papel)}
  .fixo{position:sticky;top:0;height:100svh;display:grid;place-items:center;overflow:hidden}

  /* Palco com proporção 16:9 das camadas; nunca estoura a tela */
  .palco{position:relative;width:min(100vw,177.78svh);aspect-ratio:16/9;container-type:inline-size;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
            mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
  .palco>*{position:absolute}
  .rosto{inset:0;width:100%;height:100%;display:block}

  /* Texto (mesma estética: mono espaçado + grotesca grande) */
  .titulo{left:0;right:0;top:3.6cqw;text-align:center;pointer-events:none}
  .titulo small{display:block;font:500 1.45cqw/1 "DejaVu Sans Mono","JetBrains Mono",ui-monospace,monospace;letter-spacing:.32em;
    text-transform:uppercase;padding-left:.32em;height:1.6cqw}
  .titulo small .fim{display:inline-block}
  .titulo small .fim span{display:inline-block}
  .titulo small .fim.pouso span{animation:cai .5s var(--ease) both}
  .titulo small .fim.pouso span:nth-child(2){animation-delay:.08s}
  .titulo small .cursor{display:inline-block;animation:pisca 1s steps(1) infinite}
  @keyframes pisca{50%{opacity:0}}
  @keyframes cai{from{transform:translate3d(0,-.5em,0);opacity:0}to{transform:none;opacity:1}}
  .titulo b{display:block;margin-top:.5cqw;font:500 12.6cqw/.84 Inter,"Helvetica Neue",Arial,sans-serif;letter-spacing:-.035em}

  /* Sombra de contato no cabelo */
  .sombra{left:29%;top:63.2%;width:42%;height:9%;opacity:0;
    background:radial-gradient(ellipse at 50% 40%,rgba(25,12,6,.62),rgba(25,12,6,0) 68%);mix-blend-mode:multiply}

  /* Camada coroa+mãos: posição calculada a partir da imagem original */
  .coroa{left:9.99%;top:23.06%;width:80.74%;will-change:transform;transform-origin:50% 40%;
    transform:translate3d(0,-150%,0) rotate(-3deg) scale(1.06)}
  .assenta{position:relative}
  .assenta img{display:block;width:100%;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);
            mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
  .coroa.pouso .assenta{animation:assenta .55s var(--ease)}
  @keyframes assenta{0%{transform:translate3d(0,-1.1%,0)}45%{transform:translate3d(0,.55%,0)}100%{transform:none}}

  /* Brilho dourado só no metal (máscara gerada da própria camada) */
  .brilho{position:absolute;inset:0;overflow:hidden;pointer-events:none;mix-blend-mode:plus-lighter;
    -webkit-mask:url(mask_camada.png) center/100% 100% no-repeat;mask:url(mask_camada.png) center/100% 100% no-repeat}
  .brilho i{position:absolute;top:-20%;left:0;width:24%;height:140%;opacity:0;
    background:linear-gradient(100deg,transparent 0,rgba(255,236,190,0) 15%,rgba(255,244,214,.78) 50%,rgba(255,236,190,0) 85%,transparent 100%);
    transform:translate3d(-130%,0,0) skewX(-18deg)}
  .coroa.pouso .brilho i{opacity:1;animation:varre 1.7s cubic-bezier(.45,.05,.3,1) .1s both}
  @keyframes varre{from{transform:translate3d(-130%,0,0) skewX(-18deg)}to{transform:translate3d(560%,0,0) skewX(-18deg)}}

  /* Flash curtíssimo no encaixe */
  .flash{inset:0;background:radial-gradient(60% 45% at 50% 62%,rgba(255,240,200,.55),transparent 70%);opacity:0;mix-blend-mode:screen;pointer-events:none}
  .flash.vai{animation:flash .7s ease-out}
  @keyframes flash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}

  .dica{position:absolute;left:50%;bottom:3.2svh;transform:translateX(-50%);z-index:3;display:flex;flex-direction:column;align-items:center;gap:8px;
    font:500 11px/1 "DejaVu Sans Mono",ui-monospace,monospace;letter-spacing:.34em;color:#0d0d0d;transition:opacity .5s var(--ease)}
  .dica i{width:1px;height:34px;background:linear-gradient(#0d0d0d,transparent);animation:desce 1.8s var(--ease) infinite;transform-origin:top}
  @keyframes desce{0%{transform:scaleY(0)}60%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}

  /* Selo */
  .selo{right:4%;bottom:6%;width:clamp(84px,11cqw,170px);aspect-ratio:1;color:#14110a;opacity:0;transform:translate3d(0,10px,0);transition:opacity .8s var(--ease),transform .8s var(--ease)}
  .selo.on{opacity:1;transform:none}
  .selo svg{width:100%;height:100%;animation:gira 28s linear infinite}
  .selo .miolo{position:absolute;inset:0;display:grid;place-items:center;font:700 clamp(22px,3.4cqw,52px)/1 Georgia,serif;letter-spacing:-.02em}
  @keyframes gira{to{transform:rotate(360deg)}}

  @media (max-width:767px){
    /* celular: recorte do centro das MESMAS camadas (a coroa ocupa ~96% da largura) */
    .fixo{display:flex;align-items:flex-end;justify-content:center}
    .palco{flex:none;width:235vw;max-width:none}
    .dica{bottom:auto;top:11svh}
  }
</style>
</head>
<body>
<div class="escuro">… conteúdo anterior do site …</div>

<section class="cena" id="cena">
  <div class="fixo">
    <div class="dica" id="dica" aria-hidden="true">ROLE PARA COROAR <i></i></div>
    <div class="palco" id="palco">
      <img class="rosto" src="fundo_rosto.png" alt="">
      <div class="titulo" aria-label="The Champion. Kimi">
        <small aria-hidden="true"><span id="digita"></span><span class="fim" id="fim"><span class="cursor">.</span><span class="cursor">.</span></span></small>
        <b aria-hidden="true" id="kimi">Kimi</b>
      </div>
      <div class="sombra" id="sombra"></div>
      <div class="coroa" id="coroa">
        <div class="assenta">
          <img src="camada_coroa.png" alt="">
          <div class="brilho"><i></i></div>
        </div>
      </div>
      <div class="selo" id="selo" aria-hidden="true">
        <svg viewBox="0 0 200 200">
          <defs><path id="c" d="M100,100 m-78,0 a78,78 0 1,1 156,0 a78,78 0 1,1 -156,0"/></defs>
          <circle cx="100" cy="100" r="96" fill="none" stroke="#14110a" stroke-width="1.2"/>
          <circle cx="100" cy="100" r="62" fill="none" stroke="#14110a" stroke-width=".8"/>
          <text font-size="12" fill="#14110a" font-family="Inter,system-ui,sans-serif" font-weight="600">
            <textPath href="#c" textLength="486" lengthAdjust="spacing">CAMPEÃO MUNDIAL 2026 · O MAIS JOVEM DA HISTÓRIA ·</textPath>
          </text>
        </svg>
        <div class="miolo">20</div>
      </div>
    </div>
  </div>
</section>
<div class="escuro">… próxima seção …</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cena=$('cena'), coroa=$('coroa'), sombra=$('sombra'), selo=$('selo'), dica=$('dica');
  const digita=$('digita'), fim=$('fim'), kimi=$('kimi');
  const TXT = 'THE CHAMPI';
  const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;            // easeInOutCubic
  let pousou=false, raf=0;

  function progresso(){
    const r=cena.getBoundingClientRect();
    const total=r.height-innerHeight;
    return clamp(-r.top/total);
  }
  function quadro(p){
    // 0–0.12: digita o título e revela "Kimi"
    const n=Math.round(clamp(p/0.10)*TXT.length);
    digita.textContent=TXT.slice(0,n);
    const k=clamp((p-0.03)/0.09);
    kimi.style.opacity=k; kimi.style.transform=`translate3d(0,${(1-k)*2.2}cqw,0)`;

    // 0.14–0.58: a coroa desce
    const d=ease(clamp((p-0.14)/0.44));
    coroa.style.transform=`translate3d(0,${-150*(1-d)}%,0) rotate(${-3*(1-d)}deg) scale(${1+0.06*(1-d)})`;
    sombra.style.opacity=Math.pow(d,3)*1;
    sombra.style.transform=`scale(${0.75+0.25*d})`;

    // encaixe
    const agora=p>=0.58;
    if(agora && !pousou){
      pousou=true; coroa.classList.add('pouso'); fim.classList.add('pouso');
      fim.innerHTML='<span>O</span><span>N</span>';
    }else if(!agora && pousou){
      pousou=false; coroa.classList.remove('pouso'); fim.classList.remove('pouso');
      fim.innerHTML='<span class="cursor">.</span><span class="cursor">.</span>';
    }
    selo.classList.toggle('on', p>=0.72);
    dica.style.opacity = p<0.06 ? 1 : 0;
  }
  function tick(){ raf=0; quadro(progresso()); }
  addEventListener('scroll',()=>{ if(!raf) raf=requestAnimationFrame(tick); },{passive:true});
  addEventListener('resize',tick);
  quadro(progresso());
  window.__quadro=quadro;
})();
</script>
</body>
</html>
